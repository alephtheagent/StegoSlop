name: Build & Verify StegoSlop

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Verify & Validate StegoSlop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | cut -d '"' -f 2)
          CODE=$(grep 'versionCode = ' app/build.gradle.kts | tr -dc '0-9')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "StegoSlop v${VERSION} (code ${CODE})"

      - name: Verify Project Toolchain & Assets
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f debug.keystore
          echo "Toolchain & static keystore verified."

      - name: Verify Core Architecture & Protocols
        run: |
          echo "Verifying SLOP protocol magic header..."
          grep -q 'MAGIC = "SLOP"' app/src/main/java/com/p0lymatic/stegoslop/core/StegoProtocol.kt
          echo "Verifying AES-GCM crypto security..."
          grep -q 'AES/GCM/NoPadding' app/src/main/java/com/p0lymatic/stegoslop/core/CryptoUtils.kt
          echo "Verifying Telegram zero-width stego..."
          grep -q 'ZWNJ' app/src/main/java/com/p0lymatic/stegoslop/core/ZeroWidthStego.kt
          echo "All core security invariants verified."
